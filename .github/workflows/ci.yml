name: QA Framework CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: qa-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:

    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .

      - name: Black
        run: |
          black --check .

      - name: MyPy
        run: |
          mypy .


  functional-tests:

    name: API / UI / Accessibility
    runs-on: ubuntu-latest
    needs: lint

    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Packages
        run: npm install

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: API Tests
        run: |
          pytest tests/api \
          --junitxml=api-results.xml \
          --cov=. \
          --cov-report=xml \
          --cov-report=html

      - name: UI Tests
        run: |
          pytest tests/ui \
          --junitxml=ui-results.xml

      - name: Accessibility Tests
        run: |
          pytest tests/accessibility \
          --junitxml=accessibility-results.xml

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          path: |
            *.xml
            allure-results


  security-tests:

    name: Security Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Tests
        run: |
          pytest tests/security \
          --junitxml=security-results.xml

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            security-results.xml
            allure-results


  performance-tests:

    name: Performance Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:

      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common

          curl -fsSL https://dl.k6.io/key.gpg \
          | sudo gpg --dearmor \
          -o /usr/share/keyrings/k6-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
          | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 Tests
        run: |
          k6 run tests/performance/users_load.js

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: .


  ai-evaluation:

    name: AI Evaluation
    runs-on: ubuntu-latest
    needs:
      - functional-tests
      - security-tests

    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Run AI Evaluation
        run: |
          pytest tests/evaluation \
          --junitxml=ai-results.xml

      - name: Upload AI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-results
          path: |
            ai-results.xml
            allure-results


  summary:

    name: Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - functional-tests
      - security-tests
      - performance-tests
      - ai-evaluation

    if: always()

    steps:

      - name: Pipeline Summary
        run: |
          echo "===================================="
          echo "QA Framework Pipeline Finished"
          echo "===================================="
          echo ""
          echo "Completed:"
          echo "✓ Functional Tests"
          echo "✓ Security Tests"
          echo "✓ Performance Tests"
          echo "✓ AI Evaluation"
          echo ""
          echo "Artifacts uploaded successfully."