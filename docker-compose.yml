services:

  api:
    build: .
    container_name: qa_sdet-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - kafka
      - qdrant

  redis:
    image: redis:7-alpine
    container_name: qa_sdet-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: qa_sdet-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qa_sdet-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus
    container_name: qa_sdet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./src/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: qa_sdet-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

